name: Build and Release file for arm64-musl

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download musl cross-compiler toolchain
        run: |
          # wget https://musl.cc/aarch64-linux-musl-cross.tgz
          wget https://github.com/ahaoboy/aarch64-linux-musl-cross-build/releases/download/v0.1.0/aarch64-linux-musl-cross.tgz
          tar xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Download and extract file source code
        run: |
          curl -O ftp://ftp.astron.com/pub/file/file-5.45.tar.gz
          tar xzf file-5.45.tar.gz
          cd file-5.45

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y automake autoconf libtool

      - name: Configure for cross-compilation
        working-directory: file-5.45
        run: |
          autoreconf -f -i
          ./configure --host=aarch64-linux-musl --prefix=$PWD/install CC=aarch64-linux-musl-gcc CFLAGS="-static"

      - name: Build and install
        working-directory: file-5.45
        run: make && make install

      - name: Package the binary and magic database
        run: |
          mkdir -p release
          cp file-5.45/install/bin/file release/
          cp file-5.45/install/share/misc/magic.mgc release/
          tar czf file-arm64-musl.tar.gz -C release .

      - name: release nightly
        uses: ncipollo/release-action@v1
        with:
          tag: "nightly"
          artifacts: "file-*"
          allowUpdates: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
