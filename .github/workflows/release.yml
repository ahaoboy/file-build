name: release

on:
  push:

jobs:
  build:
    name: Build file (libmagic) for arm64-musl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl & cross toolchain
        run: |
          sudo apt update
          sudo apt install -y musl-tools gcc-aarch64-linux-gnu musl-dev musl-dev:arm64 qemu-user-static

      - name: Download file source code
        run: |
          curl -LO https://astron.com/pub/file/file-5.46.tar.gz
          tar xf file-5.46.tar.gz
          mv file-5.46 file-src

      - name: Configure for musl-cross
        working-directory: file-src
        run: |
          CC="aarch64-linux-gnu-gcc -static --sysroot=/usr/aarch64-linux-gnu" \
          ./configure --host=aarch64-linux-musl --enable-static

      - name: Build
        working-directory: file-src
        run: |
          make -j$(nproc)
          ls -lh src/file

      - name: Rename output
        run: |
          mv file-src/src/file file-arm64-musl

      - name: release nightly
        uses: ncipollo/release-action@v1
        with:
          tag: "nightly"
          artifacts: "file-arm64-musl"
          allowUpdates: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
